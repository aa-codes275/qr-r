<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>باركود الفيسبوك | Amira للعطور</title>
    <meta name="description" content="باركود مباشر لصفحة الفيسبوك الخاصة بمتجر Amira للعطور." />
    <link rel="icon" href="images/amira-logo.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap bar">
        <a class="brand" href="index.html">
          <img src="images/amira-logo.jpg" alt="Amira" />
          <span><b>باركود الفيسبوك</b><span>FACEBOOK QR</span></span>
        </a>
        <div class="actions"><a class="btn" href="index.html">عرض الموقع</a></div>
      </div>
    </header>

    <main class="wrap" style="padding-bottom: 60px">
      <section>
        <div class="head">
          <span class="kicker">SOCIAL QR</span>
          <h2>صفحتنا على <span class="text-gold">الفيسبوك</span></h2>
          <div class="hairline"></div>
        </div>
        <div style="max-width: 480px; margin: 0 auto;">
          <div class="panel" style="text-align: center">
            <div style="background: #fff; border-radius: 16px; padding: 16px; display: inline-block">
              <img id="qr" alt="باركود الفيسبوك" style="width: 100%; max-width: 300px" />
            </div>
            <p style="font-size: 13px; color: var(--muted); margin: 16px 0; word-break: break-all;" id="qrText">https://www.facebook.com/share/1DcqpBhk1h/?mibextid=wwXIfr</p>
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap">
              <a class="btn gold" id="dl" download="amira-facebook-qr.png" href="#">تحميل الباركود PNG</a>
              <button class="btn" id="printBtn">طباعة</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const fbUrl = "https://www.facebook.com/share/1DcqpBhk1h/?mibextid=wwXIfr";
      const size = 420;
      const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=" + size + "x" + size +
        "&margin=8&data=" + encodeURIComponent(fbUrl);
      
      document.getElementById("qr").src = qrApiUrl;
      document.getElementById("dl").href = qrApiUrl;
      document.getElementById("qrText").textContent = fbUrl;
      document.getElementById("printBtn").addEventListener("click", () => window.print());
    </script>
  </body>
</html>
